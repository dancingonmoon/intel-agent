id: ru-tetra
name: 俄罗斯专网通信（TETRA/DMR/PoC/PMR）
timezone: Europe/Moscow
languages: [ru, en]
countries: [RU, BY, KZ]
window:
  kind: rolling
  hours: 168
  include_seen: true      # 7-day rolling report keeps items already seen on earlier days

engines:
  # GDELT is intentionally absent: the current proxy exit IP gets HTTP 429
  # from api.gdeltproject.org. Add `gdelt` back when the exit IP is clean.
  priority: [google_news_ru, brave, telegram, media_rss, bing_news, x, yandex]
  per_engine_max_queries: 10
  # Yandex News (yandex.ru/news -> dzen.ru/news) works after a manual login;
  # web search is captcha-prone and no longer used.
  yandex_mode: browser        # browser | off

facets:
  contracts:
    label: 重大合同
    strong: [контракт, тендер, закупк, поставк, договор, подряд, "contract", "tender", "award", "procurement", госзакупк, госконтракт, аукцион]
    weak: [соглашени, проект, бюджет]
  industry:
    label: 行业动态
    strong: [оператор, регулятор, "ФАС", "Минцифр", рынк, отрасл, диспетчер, экстренн, "силовые структуры", "МВД", "МЧС", "РЖД"]
    weak: [ассоциац, конференц, форум, прогноз]
  technology:
    label: 技术发展
    strong: [радиостанц, станци, терминал, "TETRA:BURST", стандарт, прошивк, шифрован, модернизац, транкинг, профессиональн, "DMR", "dPMR", "NXDN", "P25", "PoC", "PTT", "PMR", ретранслятор, абонентск, цифров]
    weak: [разработк, испытани, сертификац]
  players:
    label: 主要玩家
    # Company-level intent only. Entity names live in `entities`, not here,
    # otherwise every article about a vendor becomes "players".
    strong: [назначен, отставк, санкц, партнерств, приобрел, купил, дивиденд, выручк, прибыл, интервью]
    weak: [компани, холдинг, концерн, выставк]

